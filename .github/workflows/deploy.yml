name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 준다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊긴 사이트가 남지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 엔진 테스트가 깨진 채로 배포되는 일이 없게 빌드보다 먼저 돌린다.
      - run: npm test

      - run: npm run build

      # enablement: true(워크플로가 Pages를 스스로 켜는 옵션)는 GITHUB_TOKEN 권한이 부족해
      # 거부됐다. Pages는 저장소 Settings → Pages → Source = GitHub Actions 로 한 번만 켜 두면 된다.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
